<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيف المشاريع VIB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23c8501e%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22>🗂️</text></svg>">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f5f1;
    --paper-light:#ffffff;
    --paper-dark:#f0eee7;
    --ink:#14110d;
    --ink-soft:#5a5245;
    --orange:#c8501e;
    --orange-light:#e9782f;
    --orange-deep:#a63c14;
    --line:#e6e1d5;
    --line-soft:rgba(47,43,38,.10);
    --green:#4c7a3d;
    --green-soft:#eaf3e6;
    --red:#c0392b;
    --shadow: 0 1px 2px rgba(31,27,20,.05), 0 6px 16px rgba(31,27,20,.06);
    --shadow-sm: 0 1px 2px rgba(31,27,20,.05), 0 2px 6px rgba(31,27,20,.05);
    --shadow-hover: 0 4px 10px rgba(31,27,20,.08), 0 12px 28px rgba(31,27,20,.10);
    --radius-lg:16px;
    --radius:12px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    font-weight:500;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100vh;
    position:relative;
  }
  input,textarea,select,button{font-weight:500;}
  ::selection{background:var(--orange-light);color:#fff;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#d8d2c2;border-radius:10px;border:2px solid var(--paper);}
  ::-webkit-scrollbar-thumb:hover{background:var(--orange-light);}

  .wrap{max-width:1180px;margin:0 auto;padding:32px 28px 90px;position:relative;z-index:2;}

  /* ===== Header ===== */
  header.top{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;margin-bottom:18px;
  }
  .brand-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--orange-deep);
    font-weight:700;
    letter-spacing:.08em;
    margin-bottom:3px;
    display:flex;align-items:center;gap:6px;
  }
  h1.brand{
    font-family:'Lalezar',cursive;
    font-size:31px;
    line-height:1.1;
    margin:0;
    color:var(--ink);
    letter-spacing:.4px;
    display:flex;align-items:center;gap:8px;
  }
  .brand-sub{
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .import-project-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--orange);color:#fff;border:1px solid var(--orange-deep);
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow-sm);
    padding:7px 14px;cursor:pointer;font-family:'Tajawal',sans-serif;
    min-width:78px;transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .import-project-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);background:var(--orange-light);}
  .import-project-btn:active{transform:translateY(0);box-shadow:var(--shadow-sm);}
  .import-project-btn .ipb-icon{font-size:19px;line-height:1;}
  .import-project-btn .ipb-label{font-size:13px;font-weight:800;}
  .clock-panel{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--ink);
    color:var(--paper-light);
    border:1px solid var(--ink);
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow-sm);
    padding:7px 14px;
    min-width:150px;
    direction:rtl;
  }
  .clock-time{
    font-family:'JetBrains Mono',monospace;
    font-size:19px;
    font-weight:800;
    color:var(--orange-light);
    line-height:1;
    letter-spacing:.03em;
    direction:ltr;
  }
  .clock-daydate{
    font-family:'Tajawal',sans-serif;
    font-size:13px;
    font-weight:800;
    color:var(--paper-light);
    opacity:.9;
    line-height:1.2;
    text-align:center;
  }

  /* ===== Dashboard stats bar ===== */
  .stats-bar{
    display:flex;gap:8px;flex-wrap:wrap;
    margin-bottom:16px;
  }
  .stat-chip{
    --stat-color: var(--orange);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    background:var(--paper-light);
    border:1px solid var(--line);
    border-top:3px solid var(--stat-color);
    border-radius:var(--radius-sm);
    padding:8px 16px;min-width:84px;
    cursor:pointer;box-shadow:var(--shadow-sm);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .stat-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
  .stat-chip.active{background:var(--stat-color);}
  .stat-chip.active .stat-num, .stat-chip.active .stat-lbl{color:#fff;}
  .stat-chip.stat-total{--stat-color:var(--ink);}
  .stat-chip.stat-ideas{--stat-color:var(--orange);cursor:pointer;}
  .stat-num{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:22px;color:var(--ink);}
  .stat-lbl{font-family:'Tajawal',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);white-space:nowrap;}

  /* ===== Backup reminder banner ===== */
  .backup-reminder{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    background:#fdf3e7;border:1px solid #f0d9b5;border-inline-start:4px solid var(--orange);
    border-radius:var(--radius-sm);
    padding:12px 16px;margin-bottom:16px;
    box-shadow:var(--shadow-sm);
  }
  .backup-reminder-text{
    font-family:'Tajawal',sans-serif;font-size:16px;font-weight:600;color:var(--ink);flex:1;min-width:220px;
  }
  .backup-reminder-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .btn{
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:16px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:var(--paper-light);
    color:var(--ink);
    padding:10px 16px;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--orange-light);}
  .btn:active{transform:translateY(0);box-shadow:var(--shadow-sm);}
  .btn-primary{background:var(--orange);color:#fff;border-color:var(--orange-deep);}
  .btn-primary:hover{background:var(--orange-light);}
  .btn-ghost{background:transparent;box-shadow:none;}
  .btn-ghost:hover{background:var(--paper-dark);box-shadow:none;transform:none;}
  .btn-danger{background:var(--red);color:#fff;border-color:var(--red);}
  .btn-sm{padding:6px 11px;font-size:14px;border-radius:7px;}
  .search-wrap{
    flex:1;min-width:200px;position:relative;display:flex;align-items:center;
  }
  .search-wrap .search-icon{
    position:absolute;right:14px;font-size:17px;opacity:.55;pointer-events:none;
  }
  .search{
    width:100%;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    padding:10px 40px 10px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:var(--paper-light);
    color:var(--ink);
    box-shadow:var(--shadow-sm);
  }
  .search:focus, input:focus, textarea:focus, select:focus{outline:2px solid var(--orange-light);outline-offset:1px;}

  /* ===== Empty state ===== */
  .empty{
    border:1.5px dashed var(--line);
    border-radius:var(--radius-lg);
    padding:56px 30px;
    text-align:center;
    background:var(--paper-light);
  }
  .empty h2{font-family:'Lalezar',cursive;font-size:34px;margin:0 0 8px;color:var(--orange-deep);}
  .empty p{color:var(--ink-soft);margin:0 0 20px;font-size:17px;}

  /* ===== Grid & Cards ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
  }
  .card{
    position:relative;
    z-index:1;
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
    padding:16px 16px 14px;
    display:flex;flex-direction:column;gap:8px;
    min-height:240px;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  .card.menu-open{z-index:60;}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:#dcd5c4;}
  .card-top{
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  }
  .card-top-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .card-index{
    background:var(--ink);color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;
    padding:4px 10px;letter-spacing:.03em;border-radius:20px;flex:0 0 auto;
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .card-date-chip{
    display:inline-flex;align-items:center;gap:4px;
    font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;
    color:var(--ink-soft);background:var(--paper-dark);
    padding:4px 10px;border-radius:20px;flex:0 0 auto;
  }
  .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .meta-chip{
    display:inline-flex;align-items:center;gap:4px;
    font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;
    color:var(--ink-soft);background:var(--paper-dark);
    padding:4px 9px;border-radius:20px;
  }
  .card h3{
    font-family:'Tajawal',sans-serif;
    font-weight:800;font-size:21px;
    margin:2px 0 0;color:var(--ink);
    line-height:1.35;
  }
  .card p.desc{
    font-size:15px;color:var(--ink-soft);
    line-height:1.6;
    margin:0;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;}
  .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;font-weight:600;
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px 10px;
    background:var(--paper-dark);
    color:var(--ink-soft);
  }
  .tag::before{content:"# ";opacity:.55;}
  .card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;align-items:center;}
  .card-actions .btn-sm{padding:5px 9px;font-size:13px;}
  .card-menu-wrap{position:relative;}
  .card-menu{
    display:none;position:absolute;z-index:20;top:calc(100% + 4px);left:0;
    background:var(--paper-light);border:1px solid var(--line);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-hover);min-width:180px;padding:6px;flex-direction:column;gap:2px;
  }
  .card-menu.open{display:flex;}
  .card-menu button{
    text-align:right;background:transparent;border:none;padding:8px 10px;border-radius:6px;
    font-family:'Tajawal',sans-serif;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .card-menu button:hover{background:var(--paper-dark);}
  .card-menu button.menu-danger{color:var(--red);}
  .card-menu button.menu-danger:hover{background:#fbeae7;}
  .card-menu-sep{height:1px;background:var(--line);margin:4px 2px;}

  /* ===== Status badge ===== */
  .status-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800;
    padding:4px 10px;border-radius:20px;
    color:#fff;align-self:flex-start;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
  }

  /* ===== Filter toolbar ===== */
  .filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .filter-bar select{
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:15px;
    border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--paper-light);color:var(--ink);
    padding:8px 12px;cursor:pointer;box-shadow:var(--shadow-sm);
  }
  .filter-bar label.fb-label{font-size:14px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:4px;}

  /* ===== Priority / stage chips (viral ideas) ===== */
  .priority-row{display:flex;align-items:center;gap:6px;}
  .priority-badge{
    font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;
    border-radius:20px;padding:4px 10px;background:var(--paper-dark);color:var(--ink-soft);
  }
  .priority-opt{
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px;cursor:pointer;font-size:16px;background:#fff;
    transition:all .12s ease;
  }
  .priority-opt.active{background:var(--orange);color:#fff;border-color:var(--orange-deep);}

  /* ===== Backup / icon buttons ===== */
  .backup-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--ink);color:var(--paper-light);border:1px solid var(--ink);
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow-sm);padding:7px 12px;cursor:pointer;font-family:'Tajawal',sans-serif;
    min-width:78px;transition:transform .12s ease, box-shadow .12s ease;
  }
  .backup-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
  .backup-btn:active{transform:translateY(0);box-shadow:var(--shadow-sm);}
  .backup-btn .ipb-icon{font-size:19px;line-height:1;}
  .backup-btn .ipb-label{font-size:13px;font-weight:800;}
  .backup-btn.ideas-btn{background:var(--orange);border-color:var(--orange-deep);}
  .backup-btn.autosave-on{background:var(--green);border-color:#3a5f2f;}
  .backup-btn.autosave-warn{background:var(--red);border-color:#8f2e22;}

  /* ===== Modal / Editor ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(30,26,20,.5);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:50;
    animation:overlayFade .18s ease;
  }
  @keyframes overlayFade{from{opacity:0;}to{opacity:1;}}
  @keyframes modalPop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:0 30px 70px rgba(20,16,10,.35);
    width:100%;max-width:760px;
    padding:0;overflow:hidden;
    animation:modalPop .2s cubic-bezier(.2,.8,.3,1);
  }
  .modal-head{
    background:var(--ink);color:var(--paper-light);
    padding:18px 24px;
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;
  }
  .modal-head h2{
    font-family:'Lalezar',cursive;font-size:26px;margin:0;color:var(--orange-light);
    letter-spacing:.5px;display:flex;align-items:center;gap:8px;
  }
  .modal-body{padding:22px 24px;}
  .field{margin-bottom:20px;}
  .field label{
    display:flex;justify-content:space-between;align-items:center;
    font-family:'Tajawal',sans-serif;
    font-size:17px;
    color:var(--orange-deep);font-weight:800;
    margin-bottom:8px;
  }
  .copy-btn{
    font-family:'Tajawal',sans-serif;
    font-size:14px;font-weight:700;
    color:var(--ink);background:var(--paper-dark);
    border:1px solid var(--line);border-radius:7px;
    padding:4px 10px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;
    transition:background .12s ease;
  }
  .copy-btn:hover{background:var(--orange-light);color:#fff;border-color:var(--orange-light);}
  .copy-btn:active{transform:translateY(1px);}
  .copy-btn.clear-btn:hover{background:var(--red);color:#fff;border-color:var(--red);}
  .label-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%;
    font-family:'Tajawal',sans-serif;
    font-size:19px;
    font-weight:500;
    line-height:1.8;
    padding:13px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:#fff;
    color:var(--ink);
    resize:vertical;
    transition:border-color .12s ease;
  }
  .field input:hover, .field textarea:hover, .field select:hover{border-color:#d8d2c2;}
  .field-date-hero{
    background:var(--orange);
    border-radius:var(--radius);
    padding:14px 18px;
  }
  .field-date-hero label{color:#fff;font-size:17px;}
  .field-date-hero input{border:1px solid var(--orange-deep);font-weight:700;border-radius:7px;}
  .meta-timestamps{
    display:flex;gap:14px;flex-wrap:wrap;
    font-family:'Tajawal',sans-serif;font-size:13px;color:var(--ink-soft);
    margin:8px 2px 18px;
  }
  .index-edit-wrap{
    display:flex;align-items:center;gap:4px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
    border-radius:7px;padding:3px 8px;
  }
  .index-edit-wrap input{
    width:52px;background:transparent;border:none;color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;
    text-align:center;padding:2px;
  }
  .index-edit-wrap input:focus{outline:1px solid var(--orange-light);border-radius:4px;}
  textarea.small{min-height:90px;}
  textarea.med{min-height:130px;}
  textarea.big{min-height:200px;}
  .custom-field-wrap{
    margin-bottom:18px;border:1px dashed var(--line);border-radius:var(--radius);padding:14px;background:var(--paper-dark);
  }
  .custom-field-top{
    display:flex;gap:8px;align-items:center;margin-bottom:10px;
  }
  .custom-field-top input.label-in{
    flex:1;
    font-family:'Tajawal',sans-serif;
    font-size:18px;
    font-weight:700;
    line-height:1.6;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
  }
  .remove-x{
    background:var(--red);color:#fff;border:1px solid var(--red);border-radius:7px;
    width:36px;height:36px;flex:0 0 auto;cursor:pointer;font-weight:700;
  }
  .add-field-btn{font-size:15px;}

  /* ===== Dual-language field groups (Arabic / English) ===== */
  .lang-group{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
  }
  @media(max-width:700px){ .lang-group{grid-template-columns:1fr;} }
  .lang-col{
    display:flex;flex-direction:column;gap:7px;
  }
  .lang-head{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-family:'Tajawal',sans-serif;font-size:15px;font-weight:800;color:var(--orange-deep);
    background:var(--paper-dark);border-radius:7px;padding:6px 10px;
  }
  .lang-head span:first-of-type{flex:1;}
  .lang-logo{
    width:20px;height:20px;object-fit:contain;border-radius:5px;background:#fff;border:1px solid var(--line);
  }
  .lang-col textarea, .lang-col input[type=text]{
    width:100%;
    font-family:'Tajawal',sans-serif;
    font-size:17px;
    font-weight:500;
    line-height:1.7;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    resize:vertical;
    min-height:90px;
    transition:border-color .12s ease;
  }
  .lang-col textarea:hover, .lang-col input[type=text]:hover{border-color:#d8d2c2;}
  .cf-lang-group .lang-col textarea{min-height:90px;}
  .modal-foot{
    display:flex;justify-content:space-between;gap:10px;
    padding:16px 24px;border-top:1px solid var(--line);
    flex-wrap:wrap;background:var(--paper-dark);
  }
  /* ===== Project editor — full page (not a modal) ===== */
  .editor-page{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
  }
  .editor-sticky-head{

<body>

<div class="wrap" id="app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div style="font-family:'Tajawal',sans-serif;font-size:14px;color:var(--ink-soft);">جارِ تحميل الأرشيف...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Constants ============ */
const WEEKDAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const STORAGE_KEY = 'video-archive-data-v1';
function viewFromHash(){ return location.hash === '#viral' ? 'viral' : (location.hash === '#published' ? 'published' : 'dashboard'); }
let currentView = viewFromHash();
const CONTENT_TYPES = ['ريلز قصير','فيديو طويل','دوكيومنتري','سلسلة تاريخية','محتوى ترفيهي','محتوى تعليمي','أخرى'];
const PROJECT_STATUSES = [
  {key:'idea', label:'💡 فكرة', color:'#6b6154'},
  {key:'writing', label:'✍️ قيد الكتابة', color:'#c8501e'},
  {key:'ready', label:'🎬 جاهز للتصوير', color:'#5c6e42'},
  {key:'published', label:'✅ تم النشر', color:'#2a2621'}
];
function statusInfo(key){ return PROJECT_STATUSES.find(s=>s.key===key) || PROJECT_STATUSES[0]; }
const VIRAL_PRIORITIES = [
  {key:1, label:'🔥 متوسطة'},
  {key:2, label:'🔥🔥 عالية'},
  {key:3, label:'🔥🔥🔥 ممتازة'}
];
function priorityInfo(key){ return VIRAL_PRIORITIES.find(p=>p.key===Number(key)) || VIRAL_PRIORITIES[0]; }
const IDEA_STAGES = [
  {key:'raw', label:'💡 فكرة خام'},
  {key:'research', label:'🔍 قيد البحث'},
  {key:'ready', label:'✅ جاهزة للتنفيذ'}
];
function stageInfo(key){ return IDEA_STAGES.find(s=>s.key===key) || IDEA_STAGES[0]; }
const BACKUP_VERSION = 1;

/* ============ Google Drive Sync Config ============
   عشان تفعّل تسجيل الدخول بحساب جوجل والمزامنة الحقيقية مع Drive،
   لازم تحط الـ Client ID بتاعك هنا بدل النص ده.
   شوف الخطوات كاملة في شرح Claude في المحادثة.
*/
const GOOGLE_CLIENT_ID = 'YOUR_CLIENT_ID_HERE.apps.googleusercontent.com';
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GOOGLE_DRIVE_FILENAME = 'ارشيف_المشاريع_نسخة_تلقائية_Drive.json';

/* حفظ تلقائي في ملف حقيقي على الجهاز (File System Access API) — مدعوم في Chrome / Edge على الكمبيوتر فقط */
let autoSaveHandle = null;
let autoSaveStatus = 'unsupported'; // unsupported | not_linked | needs_permission | linked | error
let autoSaveLastWriteAt = null;
let autoSaveWriteTimer = null;
const AUTOSAVE_IDB_NAME = 'archive-autosave-db';
const AUTOSAVE_IDB_STORE = 'handles';
const AUTOSAVE_IDB_KEY = 'backupFileHandle';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(AUTOSAVE_IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(AUTOSAVE_IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSetHandle(handle){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(AUTOSAVE_IDB_STORE, 'readwrite');
    tx.objectStore(AUTOSAVE_IDB_STORE).put(handle, AUTOSAVE_IDB_KEY);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGetHandle(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(AUTOSAVE_IDB_STORE, 'readonly');
    const req = tx.objectStore(AUTOSAVE_IDB_STORE).get(AUTOSAVE_IDB_KEY);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbDeleteHandle(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(AUTOSAVE_IDB_STORE, 'readwrite');
    tx.objectStore(AUTOSAVE_IDB_STORE).delete(AUTOSAVE_IDB_KEY);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

async function initAutoSaveFile(){
  if(!('showSaveFilePicker' in window)){
    autoSaveStatus = 'unsupported';
    return;
  }
  try{
    const handle = await idbGetHandle();
    if(!handle){ autoSaveStatus = 'not_linked'; return; }
    autoSaveHandle = handle;
    const perm = await handle.queryPermission({ mode:'readwrite' });
    autoSaveStatus = (perm === 'granted') ? 'linked' : 'needs_permission';
  }catch(e){
    console.error(e);
    autoSaveStatus = 'not_linked';
  }
}

async function linkAutoSaveFile(){
  if(!('showSaveFilePicker' in window)){
    showToast('المتصفح ده مش بيدعم الحفظ التلقائي في ملف — استخدم Chrome أو Edge على الكمبيوتر');
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'ارشيف_المشاريع_نسخة_تلقائية.json',
      types: [{ description:'JSON Backup', accept: { 'application/json': ['.json'] } }]
    });
    autoSaveHandle = handle;
    await idbSetHandle(handle);
    autoSaveStatus = 'linked';
    await writeAutoSaveFile();
    render();
    showToast('تم ربط الملف — هيتحفظ تلقائي مع كل تعديل ✓');
  }catch(e){
    if(e && e.name !== 'AbortError'){
      console.error(e);
      showToast('تعذر ربط الملف');
    }
  }
}

async function grantAutoSavePermission(){
  if(!autoSaveHandle) return;
  try{
    const perm = await autoSaveHandle.requestPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      autoSaveStatus = 'linked';
      await writeAutoSaveFile();
      showToast('تم تفعيل الحفظ التلقائي ✓');
    } else {
      showToast('محتاج تسمح بالوصول للملف عشان الحفظ التلقائي يشتغل');
    }
  }catch(e){
    console.error(e);
  }
  render();
}

async function unlinkAutoSaveFile(){
  autoSaveHandle = null;
  autoSaveStatus = 'not_linked';
  autoSaveLastWriteAt = null;
  try{ await idbDeleteHandle(); }catch(e){ console.error(e); }
  render();
  showToast('تم إلغاء ربط ملف الحفظ التلقائي');
}

function scheduleAutoSaveWrite(){
  if(autoSaveStatus !== 'linked' || !autoSaveHandle) return;
  clearTimeout(autoSaveWriteTimer);
  autoSaveWriteTimer = setTimeout(writeAutoSaveFile, 800);
}

async function writeAutoSaveFile(){
  if(autoSaveStatus !== 'linked' || !autoSaveHandle) return;
  try{
    const payload = buildFullBackupPayload();
    const writable = await autoSaveHandle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    autoSaveLastWriteAt = Date.now();
  }catch(e){
    console.error('Auto-save write failed', e);
    autoSaveStatus = (e && e.name === 'NotAllowedError') ? 'needs_permission' : 'error';
    render();
  }
}

let driveWriteTimer = null;

function isGoogleClientIdConfigured(){
  return !!GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('YOUR_CLIENT_ID_HERE') === -1;
}

function initGoogleDriveSync(){
  if(!isGoogleClientIdConfigured()){
    driveSyncStatus = 'no_client_id';
    return;
  }
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
    driveSyncStatus = 'unavailable';
    initGoogleDriveSync._retries = (initGoogleDriveSync._retries || 0) + 1;
    if(initGoogleDriveSync._retries <= 20){
      setTimeout(initGoogleDriveSync, 300);
    }
    return;
  }
  try{
    googleTokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_DRIVE_SCOPE,
      prompt: '',
      callback: handleGoogleTokenResponse
    });
    driveSyncStatus = 'signed_out';
    render();
    // محاولة تسجيل دخول صامت لو المستخدم كان مسجّل قبل كده في نفس الجلسة
    if(googleDriveFileId){
      googleTokenClient.requestAccessToken({ prompt: '' });
    }
  }catch(e){
    console.error(e);
    driveSyncStatus = 'error';
  }
}

async function handleGoogleTokenResponse(resp){
  if(resp.error){
    console.error('Google auth error', resp);
    if(driveSyncStatus === 'connecting') driveSyncStatus = 'signed_out';
    render();
    return;
  }
  googleAccessToken = resp.access_token;
  driveSyncStatus = 'connecting';
  render();
  try{
    await fetchGoogleUserEmail();
    await ensureDriveBackupFile();
    // قبل ما نكتب فوق نسخة Drive، نتأكد إن مفيش نسخة أحدث محفوظة هناك
    // (مثلاً لو المستخدم بيسجل دخول أول مرة من جهاز جديد) — لو موجودة
    // بنسترجعها بدل ما نمسحها.
    const cloud = await readDriveBackup();
    if(cloud && cloud.state){
      const cloudTime = getLatestUpdateTimestamp(cloud.state);
      const localTime = getLatestUpdateTimestamp(state);
      if(cloudTime > localTime){
        state = Object.assign({}, state, cloud.state);
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        showToast('تم استرجاع مشاريعك المحفوظة من Google Drive ✓');
      }
    }
    driveSyncStatus = 'linked';
    await writeDriveBackup();
    showToast('تم تسجيل الدخول بجوجل — الحفظ التلقائي على Drive شغال ✓');
  }catch(e){
    console.error(e);
    driveSyncStatus = 'error';
  }
  render();
}

function getLatestUpdateTimestamp(st){
  if(!st) return 0;
  let latest = st.lastBackupAt || st.firstUsedAt || 0;
  (st.projects || []).forEach(p=>{
    if(p && p.updatedAt && p.updatedAt > latest) latest = p.updatedAt;
  });
  (st.viralIdeas || []).forEach(v=>{
    if(v && v.updatedAt && v.updatedAt > latest) latest = v.updatedAt;
  });
  return latest;
}

async function readDriveBackup(){
  if(!googleAccessToken || !googleDriveFileId) return null;
  try{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${googleDriveFileId}?alt=media`, {
      headers: { Authorization: 'Bearer ' + googleAccessToken }
    });
    if(!res.ok) return null;
    const text = await res.text();
    if(!text) return null;
    return JSON.parse(text);
  }catch(e){
    console.error('تعذر قراءة نسخة Drive', e);
    return null;
  }
}

function signInWithGoogle(){
  if(!isGoogleClientIdConfigured()){
    showToast('لسه محتاج تحط Client ID بتاع جوجل جوه الكود عشان الميزة دي تشتغل');
    return;
  }
  if(!googleTokenClient){
    showToast('حصلت مشكلة في تحميل مكتبة تسجيل الدخول من جوجل، جرب تحدّث الصفحة');
    return;
  }
  driveSyncStatus = 'connecting';
  render();
  googleTokenClient.requestAccessToken({ prompt: 'consent' });
}

async function fetchGoogleUserEmail(){
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + googleAccessToken }
    });
    if(res.ok){
      const data = await res.json();
      googleUserEmail = data.email || null;
    }
  }catch(e){ console.error(e); }
}

async function ensureDriveBackupFile(){
  if(googleDriveFileId){
    // تأكد إن الملف لسه موجود ومش محذوف
    const check = await fetch(`https://www.googleapis.com/drive/v3/files/${googleDriveFileId}?fields=id,trashed`, {
      headers: { Authorization: 'Bearer ' + googleAccessToken }
    });
    if(check.ok){
      const info = await check.json();
      if(!info.trashed) return;
    }
    googleDriveFileId = null;
  }
  const q = encodeURIComponent(`name='${GOOGLE_DRIVE_FILENAME}' and trashed=false`);
  const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + googleAccessToken }
  });
  if(searchRes.ok){
    const data = await searchRes.json();
    if(data.files && data.files.length > 0){
      googleDriveFileId = data.files[0].id;
      window.localStorage.setItem(GOOGLE_DRIVE_FILEID_KEY, googleDriveFileId);
      return;
    }
  }
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: {
      Authorization: 'Bearer ' + googleAccessToken,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ name: GOOGLE_DRIVE_FILENAME, mimeType: 'application/json' })
  });
  if(!createRes.ok) throw new Error('تعذر إنشاء ملف على Google Drive');
  const created = await createRes.json();
  googleDriveFileId = created.id;
  window.localStorage.setItem(GOOGLE_DRIVE_FILEID_KEY, googleDriveFileId);
}

function scheduleDriveWrite(){
  if(driveSyncStatus !== 'linked' || !googleAccessToken || !googleDriveFileId) return;
  clearTimeout(driveWriteTimer);
  driveWriteTimer = setTimeout(writeDriveBackup, 1000);
}

async function writeDriveBackup(){
  if(driveSyncStatus !== 'linked' || !googleAccessToken || !googleDriveFileId) return;
  try{
    const payload = buildFullBackupPayload();
    const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${googleDriveFileId}?uploadType=media`, {
      method: 'PATCH',
      headers: {
        Authorization: 'Bearer ' + googleAccessToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload, null, 2)
    });
    if(res.status === 401){
      // التوكين خلص، هيطلب توكين جديد بصمت وبعدين يعيد الكتابة
      driveSyncStatus = 'signed_out';
      render();
      googleTokenClient && googleTokenClient.requestAccessToken({ prompt: '' });
      return;
    }
    if(!res.ok) throw new Error('Drive write failed: ' + res.status);
    autoSaveLastWriteAt = Date.now();
  }catch(e){
    console.error('Drive auto-save write failed', e);
    driveSyncStatus = 'error';
    render();
  }
}

function signOutGoogleDrive(){
  const token = googleAccessToken;
  googleAccessToken = null;
  driveSyncStatus = 'signed_out';
  googleUserEmail = null;
  if(token && window.google && window.google.accounts && window.google.accounts.oauth2){
    window.google.accounts.oauth2.revoke(token, ()=>{});
  }
  render();
  showToast('تم تسجيل الخروج من جوجل درايف');
}

async function loadState(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    console.log('لا توجد بيانات محفوظة بعد، بدء أرشيف جديد.', e);
  }
  if(!state.firstUsedAt){
    state.firstUsedAt = Date.now();
    saveState(false);
  }
  await initAutoSaveFile();
  initGoogleDriveSync();
}
async function saveState(showT){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if(showT) showToast('تم الحفظ بنجاح ✓');
  }catch(e){
    console.error(e);
    showToast('حدث خطأ أثناء الحفظ، تأكد أن المتصفح يسمح بتخزين البيانات المحلية');
  }
  scheduleAutoSaveWrite();
  scheduleDriveWrite();
}

/* ============ Full Backup (Export/Import JSON) ============ */
/* نسخة كاملة: الأرشيف + المنشورة (خانات المشاهدات) + الأفكار الفايرل + الإعدادات — بتُستخدم في التنزيل اليدوي والحفظ التلقائي والـ Drive */
function buildFullBackupPayload(){
  const pubList = state.projects.filter(p=>p.status==='published');
  const byTier = {};
  pubList.forEach(p=>{ const k = p.viewsTier || 'none'; byTier[k] = (byTier[k]||0) + 1; });
  return {
    backupVersion: BACKUP_VERSION,
    app: 'ارشيف المشاريع VIB',
    scope: 'full',
    exportedAt: new Date().toISOString(),
    summary: {
      archiveProjects: state.projects.length,
      publishedVideos: pubList.length,
      publishedByViewsTier: byTier,
      viralIdeas: (state.viralIdeas||[]).length
    },
    /* ملخص صفحة المنشورة (للقراءة فقط) — الداتا الأصلية كلها جوه state.projects */
    publishedVideos: pubList.map(p=>({ id:p.id, index:p.index, date:p.date, title:p.title, contentType:p.contentType, viewsTier:p.viewsTier||'' })),
    state: state
  };
}

function exportFullBackup(){
  try{
    const payload = buildFullBackupPayload();
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type:'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = todayISO();
    a.href = url;
    a.download = `ارشيف_المشاريع_VIB_نسخة_كاملة_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    state.lastBackupAt = Date.now();
    state.backupReminderSnoozedUntil = null;
    saveState(false);
    render();
    showToast('تم تنزيل النسخة الاحتياطية ✓');
  }catch(e){
    console.error(e);
    showToast('تعذر إنشاء النسخة الاحتياطية');
  }
}

function importFullBackup(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      const incoming = (parsed && parsed.state) ? parsed.state : parsed;
      if(!incoming || typeof incoming !== 'object' || !Array.isArray(incoming.projects)){
        showToast('ملف النسخة الاحتياطية غير صالح');
        return;
      }
      const replace = confirm('استرجاع النسخة الاحتياطية سيستبدل كل البيانات الحالية بالكامل (المشاريع والأفكار والإعدادات). اضغط "موافق" للاستبدال الكامل، أو "إلغاء" للدمج مع البيانات الحالية بدون حذف أي حاجة موجودة.');
      if(replace){
        state = {
          projects: Array.isArray(incoming.projects) ? incoming.projects : [],
          viralIdeas: Array.isArray(incoming.viralIdeas) ? incoming.viralIdeas : [],
          pdfSettings: incoming.pdfSettings || state.pdfSettings,
          nextIndex: incoming.nextIndex || ((incoming.projects||[]).length + 1),
          nextViralIndex: incoming.nextViralIndex || 1,
          pvLegacyDone: true,
          firstUsedAt: incoming.firstUsedAt || state.firstUsedAt,
          lastBackupAt: incoming.lastBackupAt || null,
          backupReminderSnoozedUntil: null
        };
      } else {
        const existingIds = new Set(state.projects.map(p=>p.id));
        (incoming.projects||[]).forEach(p=>{
          if(!existingIds.has(p.id)) state.projects.push(p);
          else if(p.viewsTier){ const ex = state.projects.find(x=>x.id===p.id); if(ex && !ex.viewsTier) ex.viewsTier = p.viewsTier; }
        });
        const existingViralIds = new Set((state.viralIdeas||[]).map(v=>v.id));
        if(!state.viralIdeas) state.viralIdeas = [];
        (incoming.viralIdeas||[]).forEach(v=>{
          if(!existingViralIds.has(v.id)) state.viralIdeas.push(v);
        });
        state.nextIndex = Math.max(state.nextIndex||1, (state.projects.length + 1));
      }
      saveState(true);
      render();
      showToast('تم استرجاع النسخة الاحتياطية بنجاح ✓');
    }catch(err){
      console.error(err);
      showToast('تعذر قراءة ملف النسخة الاحتياطية، تأكد إنه ملف JSON صحيح');
    }
  };
  reader.onerror = function(){ showToast('تعذر قراءة الملف'); };
  reader.readAsText(file, 'utf-8');
}

/* ============ Utilities ============ */
function uid(){ return 'p_' + Date.now() + '_' + Math.floor(Math.random()*10000); }
const TAG_PALETTE = [
  { bg:'#fdece1', fg:'#a63c14', bd:'#f3c9a8' },
  { bg:'#eaf3e6', fg:'#4c7a3d', bd:'#c9e2bd' },
  { bg:'#e7f0fb', fg:'#2e5c8a', bd:'#bdd7f2' },
  { bg:'#f5eafb', fg:'#6d3f91', bd:'#ddc2ef' },
  { bg:'#fdf1e0', fg:'#96650f', bd:'#f2d9a3' },
  { bg:'#fbeaea', fg:'#a63333', bd:'#f0c3c3' },
  { bg:'#e6f6f4', fg:'#1f7268', bd:'#b9e6df' },
];
function tagColor(text){
  let h = 0;
  const s = String(text||'');
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return TAG_PALETTE[h % TAG_PALETTE.length];
}
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2400);
}

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function formatDateArabic(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-').map(Number);
  if(!y) return iso;
  const dt = new Date(y, m-1, d);
  const wd = WEEKDAYS[dt.getDay()];
  return `${wd} ${d} ${MONTHS[m-1]} ${y}`;
}
function formatDateTimeArabic(ts){
  if(!ts) return '—';
  const dt = new Date(ts);
  const wd = WEEKDAYS[dt.getDay()];
  let h = dt.getHours();
  const ampm = h >= 12 ? 'م' : 'ص';
  h = h % 12; if(h===0) h = 12;
  const mm = String(dt.getMinutes()).padStart(2,'0');
  return `${wd} ${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()} — ${h}:${mm} ${ampm}`;
}

/* ============ Backup Reminder ============ */
const BACKUP_REMINDER_DAYS = 7;
const BACKUP_SNOOZE_DAYS = 3;
function getBackupReminderStatus(){
  if(autoSaveStatus === 'linked' || driveSyncStatus === 'linked') return { show:false };
  const hasData = (state.projects.length > 0) || ((state.viralIdeas||[]).length > 0);
  if(!hasData) return { show:false };
  const now = Date.now();
  if(state.backupReminderSnoozedUntil && now < state.backupReminderSnoozedUntil) return { show:false };
  const reference = state.lastBackupAt || state.firstUsedAt || now;
  const daysSince = Math.floor((now - reference) / 86400000);
  if(daysSince < BACKUP_REMINDER_DAYS) return { show:false };
  return { show:true, daysSince, neverBackedUp: !state.lastBackupAt };
}
function renderBackupReminder(){
  const status = getBackupReminderStatus();
  if(!status.show) return '';
  const msg = status.neverBackedUp
    ? 'لسه ما عملتش أي نسخة احتياطية للبيانات دي. البيانات متخزنة في المتصفح بس، ولو اتمسحت مش هترجع.'
    : `آخر نسخة احتياطية كانت من ${status.daysSince} يوم. البيانات متخزنة في المتصفح بس، يفضّل تعمل نسخة جديدة بانتظام.`;
  const showAutoSaveOffer = (autoSaveStatus === 'not_linked');
  const showDriveOffer = (driveSyncStatus === 'signed_out');
  return `
    <div class="backup-reminder">
      <div class="backup-reminder-text">⚠️ ${msg}</div>
      <div class="backup-reminder-actions">
        ${showDriveOffer ? `<button class="btn btn-sm btn-primary" id="btnEnableDriveFromBanner">☁️ سجّل دخول بجوجل درايف</button>` : ''}
        ${showAutoSaveOffer ? `<button class="btn btn-sm ${showDriveOffer?'':'btn-primary'}" id="btnEnableAutoSaveFromBanner">🔗 فعّل الحفظ التلقائي في ملف</button>` : ''}
        <button class="btn btn-sm ${(showAutoSaveOffer||showDriveOffer) ? '' : 'btn-primary'}" id="btnBackupNow">⬇️ نسخة احتياطية الآن</button>
        <button class="btn btn-sm btn-ghost" id="btnSnoozeBackup">⏰ ذكّرني بعد ${BACKUP_SNOOZE_DAYS} أيام</button>
      </div>
    </div>
  `;
}
function snoozeBackupReminder(){
  state.backupReminderSnoozedUntil = Date.now() + (BACKUP_SNOOZE_DAYS * 86400000);
  saveState(false);
  render();
}
function attachBackupReminderEvents(){

function updateClock(){
  const now = new Date();
  const day = WEEKDAYS[now.getDay()];
  const dateStr = `${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  let h = now.getHours();
  const ampm = h >= 12 ? 'م' : 'ص';
  h = h % 12; if(h===0) h = 12;
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  const dayDateEl = document.getElementById('clockDayDate');
  const timeEl = document.getElementById('clockTime');
  if(dayDateEl){
    dayDateEl.textContent = 'يوم ' + day + ' — ' + dateStr;
    timeEl.textContent = `${h}:${mm}:${ss} ${ampm}`;
  }
}

      (v.noteEn||'').toLowerCase().includes(q) ||

function saveViralEditor(id){
  const activePriority = document.getElementById('viralPriorityRow').querySelector('.priority-opt.active');
  const activeStage = document.getElementById('viralStageRow').querySelector('.priority-opt.active');
  const data = {
    date: document.getElementById('vf_date').value,
    title: document.getElementById('vf_title').value,
    titleEn: document.getElementById('vf_title_en').value,
    hook: document.getElementById('vf_hook').value,
    hookEn: document.getElementById('vf_hook_en').value,
    note: document.getElementById('vf_note').value,
    noteEn: document.getElementById('vf_note_en').value,
    audience: document.getElementById('vf_audience').value,
    audienceEn: document.getElementById('vf_audience_en').value,
    keywords: document.getElementById('vf_keywords').value,
    keywordsEn: document.getElementById('vf_keywords_en').value,
    cta: document.getElementById('vf_cta').value,
    ctaEn: document.getElementById('vf_cta_en').value,
    estimatedLength: document.getElementById('vf_estimatedLength').value,
    referenceLink: document.getElementById('vf_referenceLink').value,
    ideaStage: activeStage ? activeStage.dataset.val : 'raw',
    priority: activePriority ? Number(activePriority.dataset.val) : 1,
  };
  const existingIdx = (state.viralIdeas||[]).findIndex(x=>x.id===id);
  if(existingIdx >= 0){
    state.viralIdeas[existingIdx] = Object.assign({}, state.viralIdeas[existingIdx], data);
  } else {
    if(!state.viralIdeas) state.viralIdeas = [];
    state.viralIdeas.push(Object.assign({ id, createdAt: Date.now() }, data));
  }
  saveState(true);
  closeViralEditor();
  render();
}

function getFilteredProjects(){
  const q = (window._searchQ||'').trim().toLowerCase();
  let list = [...state.projects];
  if(q){
    list = list.filter(p =>
      (p.title||'').toLowerCase().includes(q) ||
      (p.hashtags||'').toLowerCase().includes(q) ||
      (p.tags||'').toLowerCase().includes(q) ||
      (p.contentType||'').toLowerCase().includes(q)
    );
  }
  if(window._statusFilter){
    list = list.filter(p => (p.status||'idea') === window._statusFilter);
  }
  if(window._contentTypeFilter){
    list = list.filter(p => (p.contentType||'') === window._contentTypeFilter);
  }
  const sortBy = window._sortBy || 'updated';
  if(sortBy === 'date_desc'){
    list.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  } else if(sortBy === 'date_asc'){
    list.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  } else if(sortBy === 'alpha'){
    list.sort((a,b)=> (a.title||'').localeCompare(b.title||'', 'ar'));
  } else if(sortBy === 'index'){
    list.sort((a,b)=> (a.index||0)-(b.index||0));
  } else {
    list.sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  }
  return list;
}

function duplicateProject(id){
  const p = state.projects.find(x=>x.id===id);
  if(!p) return;
  const now = Date.now();
  const copy = JSON.parse(JSON.stringify(p));
  copy.id = uid();
  copy.index = state.nextIndex;
  copy.title = (p.title || 'بدون عنوان') + ' (نسخة)';
  copy.createdAt = now;
  copy.updatedAt = now;
  copy.customFields = (p.customFields||[]).map(cf=> ({ id:'cf_'+now+Math.floor(Math.random()*1000), label:cf.label||'', value:cf.value||'', valueEn:cf.valueEn||'' }));
  state.projects.push(copy);
  state.nextIndex = state.nextIndex + 1;
  saveState(true);
  render();
  showToast('تم نسخ المشروع ✓ عدّل عليه كما تريد');
}

function deleteProject(id, fromEditor){
  const p = state.projects.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`متأكد إنك عاوز تحذف مشروع "${p.title||'بدون عنوان'}"؟ الخطوة دي مش هترجع.`)) return;
  state.projects = state.projects.filter(x=>x.id!==id);
  saveState(true);
  if(fromEditor) closeEditor();
  render();
}

/* ============ Copy to clipboard ============ */
async function copyTextToClipboard(text, successMsg){
  if(!text || !String(text).trim()){ showToast('لا يوجد نص للنسخ'); return; }
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    showToast(successMsg || 'تم النسخ ✓');
  }catch(e){
    console.error(e);
    showToast('تعذر النسخ');
  }
}
function setupCopyButtons(scope){
  (scope||document).querySelectorAll('[data-copy-target]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.preventDefault();
      const el = document.getElementById(btn.dataset.copyTarget);
      if(el) copyTextToClipboard(el.value);
    };
  });
  (scope||document).querySelectorAll('[data-cfcopy]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.preventDefault();
      const el = document.querySelector(`[data-cfvalue="${btn.dataset.cfcopy}"]`);
      if(el) copyTextToClipboard(el.value);
    };
  });
  (scope||document).querySelectorAll('[data-cfcopyen]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.preventDefault();
      const el = document.querySelector(`[data-cfvalueen="${btn.dataset.cfcopyen}"]`);
      if(el) copyTextToClipboard(el.value);
    };
  });
}

  if(!confirm('متأكد إنك عاوز تمسح محتوى الخانة دي؟ الخطوة دي مش هترجع.')) return;

/* تمدد الخانات تلقائياً حسب عدد الأسطر/الكلام بدل ما يفضل جوه صندوق ثابت الارتفاع */
function autoGrowTextarea(ta){
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 2) + 'px';
}
function setupAutoGrowTextareas(scope){
  const areas = (scope || document).querySelectorAll('textarea');
  areas.forEach(ta=>{
    ta.style.overflowY = 'hidden';
    ta.style.resize = 'none';
    autoGrowTextarea(ta);
    ta.addEventListener('input', ()=> autoGrowTextarea(ta));
  });
}

function collectCustomFields(){
  const nodes = document.querySelectorAll('.custom-field-wrap');
  const arr = [];
  nodes.forEach(n=>{
    const id = n.dataset.cfid;
    const label = n.querySelector(`[data-cflabel="${id}"]`).value;
    const value = n.querySelector(`[data-cfvalue="${id}"]`).value;
    const valueEn = n.querySelector(`[data-cfvalueen="${id}"]`).value;
    arr.push({id, label, value, valueEn});
  });
  return arr;
}

function saveEditor(){
  const data = {
    date: document.getElementById('f_date').value,
    title: document.getElementById('f_title').value,
    contentType: document.getElementById('f_contentType').value,
    status: document.getElementById('f_status') ? document.getElementById('f_status').value : (window._draft.status||'idea'),
    description: document.getElementById('f_description').value,
    idea: document.getElementById('f_idea').value,
    ideaDevelopment: document.getElementById('f_ideaDevelopment').value,
    script: document.getElementById('f_script').value,
    scriptPrompt: document.getElementById('f_scriptPrompt').value,
    hashtags: document.getElementById('f_hashtags').value,
    tags: document.getElementById('f_tags').value,
    seriesDate: document.getElementById('f_seriesDate').value,
    titleEn: document.getElementById('f_title_en').value,
    descriptionEn: document.getElementById('f_description_en').value,
    ideaEn: document.getElementById('f_idea_en').value,
    ideaDevelopmentEn: document.getElementById('f_ideaDevelopment_en').value,
    scriptEn: document.getElementById('f_script_en').value,
    scriptPromptEn: document.getElementById('f_scriptPrompt_en').value,
    hashtagsEn: document.getElementById('f_hashtags_en').value,
    tagsEn: document.getElementById('f_tags_en').value,
    seriesDateEn: document.getElementById('f_seriesDate_en').value,
    customFields: collectCustomFields(),
  };
  const existingIdx = state.projects.findIndex(x=>x.id===window._draft.id);
  // Validate the (possibly edited) project number
  const idxField = document.getElementById('f_index');
  if(idxField){
    const rawIdx = parseInt(String(idxField.value).replace(/[^0-9]/g,''), 10);
    if(!isNaN(rawIdx) && rawIdx > 0){
      const clash = state.projects.some((x,i)=> x.index === rawIdx && i !== existingIdx);
      if(clash){
        showToast('⚠️ رقم المشروع ده مستخدم بالفعل — اتحفظ بنفس الرقم القديم');
      } else {
        data.index = rawIdx;
        if(rawIdx >= state.nextIndex) state.nextIndex = rawIdx + 1;
      }
    }
  }
  const finalObj = Object.assign({}, window._draft, data, { updatedAt: Date.now() });
  if(existingIdx >= 0){
    state.projects[existingIdx] = finalObj;
  } else {
    state.projects.push(finalObj);
    state.nextIndex = state.nextIndex + 1;
  }
  saveState(true);
  closeEditor();
  render();
}

function buildProjectPlainText(p, lang){
  lang = lang === 'en' ? 'en' : 'ar';
  const isAr = lang === 'ar';
  const settings = state.pdfSettings;
  const lines = [];
  lines.push('[' + (isAr ? 'ARX — الجزء العربي' : 'TimeForge Studios — English part') + ']');
  lines.push(escapeForText(isAr ? p.title : p.titleEn) || (isAr ? 'بدون عنوان' : 'Untitled'));
  lines.push((isAr ? 'التاريخ: ' : 'Date: ') + formatDateArabic(p.date));
  lines.push((isAr ? 'نوع المحتوى: ' : 'Content type: ') + (escapeForText(p.contentType)||'—'));
  lines.push('');
  function field(labelAr, labelEn, value){
    const label = isAr ? labelAr : labelEn;
    if(!value || !String(value).trim()){
      if(settings.hideEmpty) return;
    }
    lines.push('== ' + label + ' ==');
    lines.push(value && String(value).trim() ? value : '—');
    lines.push('');
  }
  field('الفكرة', 'Idea', isAr ? p.idea : p.ideaEn);
  field('تطوير الفكرة', 'Idea Development', isAr ? p.ideaDevelopment : p.ideaDevelopmentEn);
  field('الاسكربت', 'Script', isAr ? p.script : p.scriptEn);
  field('برومت الاسكربت', 'Script Prompt', isAr ? p.scriptPrompt : p.scriptPromptEn);
  field('الوصف', 'Description', isAr ? p.description : p.descriptionEn);
  field('الهاشتاج', 'Hashtags', isAr ? p.hashtags : p.hashtagsEn);
  field('العلامات', 'Tags', isAr ? p.tags : p.tagsEn);

/* ============ Project Transfer (نسخ/استيراد المشروع بين الأجهزة) ============ */
/* البيانات مخزّنة محلياً على كل جهاز بمفرده (localStorage)، فمفيش تزامن تلقائي بين الأجهزة.
   الحل العملي: كل مشروع بيتحول لنص واحد قابل للنسخ، تنقله يدوياً (واتساب/ملاحظات/إيميل...)
   وتلصقه في أيقونة "نسخ المشروع" أعلى الصفحة على الجهاز التاني فيتضاف المشروع كامل ومنسق. */
const TRANSFER_MARKER = 'ARCHIVE_PROJECT_V1::';

function encodeProjectTransferString(p){
  const clean = {
    date: p.date, title: p.title, contentType: p.contentType, description: p.description,
    idea: p.idea, ideaDevelopment: p.ideaDevelopment, script: p.script, scriptPrompt: p.scriptPrompt,
    hashtags: p.hashtags, tags: p.tags, seriesDate: p.seriesDate,
    titleEn: p.titleEn, descriptionEn: p.descriptionEn, ideaEn: p.ideaEn,
    ideaDevelopmentEn: p.ideaDevelopmentEn, scriptEn: p.scriptEn, scriptPromptEn: p.scriptPromptEn,
    hashtagsEn: p.hashtagsEn, tagsEn: p.tagsEn, seriesDateEn: p.seriesDateEn,
    customFields: p.customFields || []
  };
  const json = JSON.stringify(clean);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return TRANSFER_MARKER + b64;
}

function decodeProjectTransferString(raw){
  try{
    const idx = raw.indexOf(TRANSFER_MARKER);
    if(idx >= 0){
      const payload = raw.slice(idx + TRANSFER_MARKER.length).trim();
      const json = decodeURIComponent(escape(atob(payload)));
      const obj = JSON.parse(json);
      return (obj && typeof obj === 'object') ? obj : null;
    }
    // fallback: ممكن يكون المستخدم لصق JSON خام بدون العلامة
    const obj = JSON.parse(raw);
    return (obj && typeof obj === 'object') ? obj : null;
  }catch(e){
    console.error(e);
    return null;
  }
}

/* استخراج كل المشاريع الموجودة داخل نص ملصوق — بيشتغل مع مشروع واحد أو عدة مشاريع منسوخة مع بعض دفعة واحدة */
function decodeAllProjectsFromText(raw){
  const projects = [];
  if(!raw || !raw.trim()) return projects;
  const re = /ARCHIVE_PROJECT_V1::([A-Za-z0-9+/=]+)/g;
  let match;
  let foundAny = false;
  while((match = re.exec(raw)) !== null){
    foundAny = true;
    try{
      const json = decodeURIComponent(escape(atob(match[1])));
      const obj = JSON.parse(json);
      if(obj && typeof obj === 'object') projects.push(obj);
    }catch(e){ console.error(e); }
  }
  if(!foundAny){
    // fallback: نص واحد بدون العلامة (JSON خام لمشروع واحد)
    const single = decodeProjectTransferString(raw.trim());
    if(single) projects.push(single);
  }
  return projects;
}

function copyProjectForTransfer(id){
  const p = getLiveProjectData(id);
  if(!p){ showToast('تعذر إيجاد بيانات المشروع'); return; }
  const transferStr = encodeProjectTransferString(p);
  copyTextToClipboard(transferStr, 'تم نسخ المشروع ✓ روح لأيقونة "نسخ المشروع" في الموقع على الجهاز التاني والصقه هناك');
}

/* نسخ عدة مشاريع (محددة أو كل المشاريع) دفعة واحدة كنص واحد قابل للصق مرة واحدة */
function copyProjectsForTransfer(ids, label){
  const list = ids.map(id=> state.projects.find(x=>x.id===id)).filter(Boolean);
  if(list.length === 0){ showToast('تعذر إيجاد المشاريع المطلوبة'); return; }
  const combined = list.map(p=> encodeProjectTransferString(p)).join('\n');
  copyTextToClipboard(combined, `تم نسخ ${label || (list.length + ' مشروع')} ✓ روح لأيقونة "نسخ المشروع" والصقهم مرة واحدة`);
  if(window._selectMode){
    window._selectMode = false;
    window._selectedIds = new Set();
    render();
  }
}

function importProjectFromText(raw, overlay){
  if(!raw || !raw.trim()){ showToast('محتاج تلصق نص المشروع الأول'); return; }
  const decoded = decodeAllProjectsFromText(raw);
  if(!decoded || decoded.length === 0){ showToast('النص ده مش صيغة مشروع صحيحة، تأكد إنك ناسخ النص كامل من زر "نسخ المشروع"'); return; }
  decoded.forEach(project=>{
    const finalObj = Object.assign({
      date: todayISO(), title:'', description:'', idea:'', ideaDevelopment:'', script:'', scriptPrompt:'',
      hashtags:'', tags:'', seriesDate:'', contentType: CONTENT_TYPES[0], customFields: [],
      titleEn:'', descriptionEn:'', ideaEn:'', ideaDevelopmentEn:'', scriptEn:'', scriptPromptEn:'',
      hashtagsEn:'', tagsEn:'', seriesDateEn:''
    }, project, {
      id: uid(),
      index: state.nextIndex,
      customFields: Array.isArray(project.customFields)
        ? project.customFields.map(cf=> ({ id: 'cf_'+Date.now()+Math.floor(Math.random()*1000), label: cf.label||'', value: cf.value||'', valueEn: cf.valueEn||'' }))
        : [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
    state.projects.push(finalObj);
    state.nextIndex = state.nextIndex + 1;
  });
  saveState(true);
  if(overlay) overlay.remove();
  render();
  showToast(decoded.length > 1 ? `تم استيراد ${decoded.length} مشروع بنجاح ✓` : 'تم استيراد المشروع بنجاح ✓');
}

function norm(s){return String(s).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^\u0621-\u064Aa-z0-9\s]/g,' ')}

var IDX={},DF={};
function idxOf(v){

function search(list,q){

/* ============ Viral Ideas — Duplicate Cleaner ============ */
const VI_MERGE_FIELDS = ['titleEn','note','noteEn','hook','hookEn','audience','audienceEn','keywords','keywordsEn','cta','ctaEn','estimatedLength','referenceLink'];
function viNorm(s){
  return String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[^ء-يa-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function viBigrams(s){ const t=s.replace(/\s/g,''), o={}; for(let i=0;i<t.length-1;i++){ const g=t.slice(i,i+2); o[g]=(o[g]||0)+1; } return o; }
function viSimilar(a,b){
  if(!a || !b) return false;
  if(a===b) return true;
  const sh = a.length<=b.length ? a : b, lg = sh===a ? b : a;
  if(sh.length>=14 && lg.indexOf(sh)>-1 && sh.length/lg.length>=.8) return true;
  const A=viBigrams(a), B=viBigrams(b); let inter=0, na=0, nb=0;
  for(const k in A){ na+=A[k]; if(B[k]) inter+=Math.min(A[k],B[k]); }
  for(const k in B) nb+=B[k];
  return na && nb ? (2*inter)/(na+nb) >= .88 : false;
}
function viScore(v){
  const stage = {raw:0, research:1, ready:2}[v.ideaStage] || 0;
  let filled = 0; VI_MERGE_FIELDS.forEach(f=>{ if(String(v[f]||'').trim()) filled++; });
  return stage*10 + filled*3 + (Number(v.priority)||0);
}
function findViralDuplicateGroups(){
  const list = state.viralIdeas||[], norm = list.map(v=>viNorm(v.title)), used = new Set(), groups = [];
  for(let i=0;i<list.length;i++){
    if(used.has(i)) continue;
    const g=[i];
    for(let j=i+1;j<list.length;j++){ if(!used.has(j) && viSimilar(norm[i],norm[j])) g.push(j); }
    if(g.length>1){
      g.forEach(k=>used.add(k));
      const items = g.map(k=>list[k]).sort((a,b)=> viScore(b)-viScore(a) || (a.createdAt||0)-(b.createdAt||0));
      groups.push({ keep:items[0], remove:items.slice(1) });
    }
  }
  return groups;
}
function openViralDedupe(){
  const groups = findViralDuplicateGroups();
  if(!groups.length){ showToast('✓ مفيش أفكار مكررة — الأرشيف نضيف'); return; }
  const total = groups.reduce((n,g)=>n+g.remove.length,0);
  const ov = document.createElement('div'); ov.className='overlay'; ov.id='viDedupeOverlay';
  ov.innerHTML = `
    <div class="modal" style="max-width:720px;">
      <div class="modal-head"><h2>🧹 الأفكار المكررة</h2><button class="btn btn-sm" id="viDedupeX" style="background:transparent;color:#fff;border-color:#fff;">✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 14px;font-weight:600;">لقيت <b>${groups.length}</b> مجموعة مكررة — هيتحذف <b>${total}</b> فكرة ويتبقى الأكمل من كل مجموعة، وأي بيانات ناقصة فيه بتتكمّل من المكررات قبل حذفها.</p>
        ${groups.map(g=>`
          <div style="border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;background:var(--paper);">
            <div style="color:var(--green);font-weight:800;">✅ يتبقى: ${escapeHtml(g.keep.title)} <small style="color:var(--ink-soft);font-weight:600;">(${formatDateArabic(g.keep.date)})</small></div>
            ${g.remove.map(r=>`<div style="color:var(--red);font-weight:600;margin-top:4px;">🗑 يتحذف: ${escapeHtml(r.title)} <small style="color:var(--ink-soft);">(${formatDateArabic(r.date)})</small></div>`).join('')}
          </div>`).join('')}
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="viDedupeGo">🧹 حذف ${total} فكرة مكررة</button>
          <button class="btn" id="viDedupeCancel">إلغاء</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = ()=> ov.remove();
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) close(); });
  document.getElementById('viDedupeX').onclick = close;
  document.getElementById('viDedupeCancel').onclick = close;
  document.getElementById('viDedupeGo').onclick = ()=>{
    const drop = new Set();
    groups.forEach(g=>{
      g.remove.forEach(r=>{
        VI_MERGE_FIELDS.forEach(f=>{ if(!String(g.keep[f]||'').trim() && String(r[f]||'').trim()) g.keep[f] = r[f]; });
        if((Number(r.priority)||0) > (Number(g.keep.priority)||0)) g.keep.priority = r.priority;
        drop.add(r.id);
      });
    });
    state.viralIdeas = (state.viralIdeas||[]).filter(v=>!drop.has(v.id));
    saveState(false); close(); render();
    showToast('تم حذف ' + drop.size + ' فكرة مكررة ✓');
  };
}

function showUndoBar(msg, onUndo){

  const bar = document.createElement('div'); bar.id = 'undoBar'; bar.className = 'undo-bar';
  const sp = document.createElement('span'); sp.textContent = msg;
  const b = document.createElement('button'); b.textContent = '↩️ تراجع';
  b.onclick = ()=>{ onUndo(); bar.remove(); };
  const x = document.createElement('button'); x.textContent = '✕'; x.className = 'undo-x'; x.onclick = ()=> bar.remove();
  bar.append(sp, b, x); document.body.appendChild(bar);
  clearTimeout(window._undoTimer); window._undoTimer = setTimeout(()=> bar.remove(), 15000);
}
function bulkConfirmText(kind, titles){
  const sample = titles.slice(0,5).map(t=>'• ' + String(t||'بدون عنوان').split('\n')[0].slice(0,60)).join('\n');
  return `متأكد إنك عاوز تحذف ${titles.length} ${kind}؟\n\n${sample}${titles.length>5 ? '\n• ...' : ''}\n\nتقدر تتراجع لمدة ثواني بعد الحذف.`;
}
function bulkDeleteProjects(ids){
  const set = new Set(ids);
  const removed = state.projects.filter(p=>set.has(p.id));
  if(!removed.length){ showToast('محتاج تحدد مشروع واحد على الأقل'); return false; }
  if(!confirm(bulkConfirmText('مشروع', removed.map(p=>p.title)))) return false;
  state.projects = state.projects.filter(p=>!set.has(p.id));
  saveState(false);
  showUndoBar(`تم حذف ${removed.length} مشروع`, ()=>{ state.projects = state.projects.concat(removed); saveState(false); render(); showToast('تم التراجع ✓'); });
  return true;
}
function bulkDeleteIdeas(ids){
  const set = new Set(ids);
  const removed = (state.viralIdeas||[]).filter(v=>set.has(v.id));
  if(!removed.length){ showToast('محتاج تحدد فكرة واحدة على الأقل'); return false; }
  if(!confirm(bulkConfirmText('فكرة', removed.map(v=>v.title)))) return false;
  state.viralIdeas = (state.viralIdeas||[]).filter(v=>!set.has(v.id));
  saveState(false);
  showUndoBar(`تم حذف ${removed.length} فكرة`, ()=>{ state.viralIdeas = (state.viralIdeas||[]).concat(removed); saveState(false); render(); showToast('تم التراجع ✓'); });
  return true;
}

/* ============ Init ============ */
(async function init(){
  await loadState();
  PV.migrateLegacy();
  render();
})();
</script>
